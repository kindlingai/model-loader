# Runs release-please on pushes to main to maintain a Release PR (CHANGELOG.md,
# .release-please-manifest.json) and, once merged, create the vX.Y.Z tag and
# GitHub Release. When release-please cuts a release — or when triggered
# manually via workflow_dispatch for an existing v* tag — tests the tagged
# commit, then publishes:
#   - ghcr.io/kindlingai/model-loader:<version> and :v<version> for linux/amd64
#     and linux/arm64, plus :latest for the newest non-prerelease version
#   - linux amd64/arm64 tarballs, SHA256SUMS, and build-provenance attestations
#     attached to the GitHub Release
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build and publish"
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'push' && 'release-please' || format('release-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      HAS_APP: ${{ secrets.RELEASE_PLEASE_APP_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - id: app-token
        if: github.event_name == 'push' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Mint a GitHub App installation token when configured so Release PRs
          # automatically trigger pull_request workflows (ci.yml, pr-title.yml);
          # falls back to GITHUB_TOKEN otherwise.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  setup:
    needs: release-please
    if: >-
      (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && !cancelled())
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      update_latest: ${{ steps.resolve.outputs.update_latest }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must match vX.Y.Z (optional -prerelease), got: $TAG"
            exit 1
          fi
          # Confirm refs/tags/$TAG exists as an exact tag ref, then dereference (handles annotated tags).
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            | jq -e --arg ref "refs/tags/$TAG" 'type == "object" and .ref == $ref' >/dev/null
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          update_latest=false
          if [ "$prerelease" = false ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' > tags.txt
            highest=$(python3 - <<'PY'
          import pathlib, re

          versions = []
          for line in pathlib.Path("tags.txt").read_text().splitlines():
              m = re.fullmatch(r"refs/tags/v(\d+)\.(\d+)\.(\d+)", line.strip())
              if m:
                  versions.append((tuple(int(x) for x in m.groups()), m.group(0)[len("refs/tags/"):]))
          print(max(versions)[1] if versions else "")
          PY
            )
            if [ "$TAG" = "$highest" ]; then
              update_latest=true
            else
              echo "latest stable tag is $highest; :latest stays"
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "commit=$commit"
            echo "prerelease=$prerelease"
            echo "update_latest=$update_latest"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    needs: [setup, test]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build tarballs
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          for arch in amd64 arm64; do
            name="model-loader_${VERSION}_linux_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "build/$name/model-loader" ./cmd/model-loader
            cp README.md LICENSE "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Check the tag matches the binary
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          got=$("build/model-loader_${VERSION}_linux_amd64/model-loader" -version)
          echo "tag $VERSION, binary: $got"
          [ "$got" = "model-loader $VERSION" ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  image:
    needs: [setup, test]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false
      - name: Pick the image tags
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          UPDATE_LATEST: ${{ needs.setup.outputs.update_latest }}
        run: |
          set -euo pipefail
          tags="$IMAGE:$VERSION,$IMAGE:v$VERSION"
          if [ "$UPDATE_LATEST" = true ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      # QEMU only so the arm64 image can be run below; the build itself
      # cross-compiles on the runner's platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.setup.outputs.version }}
          tags: ${{ env.TAGS }}
          push: true
      - name: Check each architecture runs and reports the tag
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            got=$(docker run --rm --pull always --platform "linux/$arch" "$IMAGE:$VERSION" -version)
            echo "$arch: $got"
            [ "$got" = "model-loader $VERSION" ]
          done
      # GitHub artifact attestations require a public repository (or GitHub Enterprise Cloud).
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [setup, binaries, image]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    concurrency:
      group: release-assets-${{ needs.setup.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # GitHub artifact attestations require a public repository (or GitHub Enterprise Cloud).
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload release assets and update notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
          VERSION: ${{ needs.setup.outputs.version }}
          COMMIT: ${{ needs.setup.outputs.commit }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          {
            echo "<!-- model-loader-artifacts:start -->"
            echo "### Artifacts"
            echo
            echo "- Container image (\`linux/amd64\`, \`linux/arm64\`): \`$IMAGE:$VERSION@$DIGEST\`"
            echo "- Tarballs: \`model-loader_${VERSION}_linux_amd64.tar.gz\`, \`model-loader_${VERSION}_linux_arm64.tar.gz\`, \`SHA256SUMS\` (commit \`$COMMIT\`)"
            if [ "$PUBLIC" = true ]; then
              echo
              echo "### Verification"
              echo
              echo '```bash'
              echo "gh attestation verify model-loader_${VERSION}_linux_arm64.tar.gz -R $GH_REPO"
              echo "gh attestation verify oci://$IMAGE@$DIGEST -R $GH_REPO"
              echo '```'
            fi
            echo "<!-- model-loader-artifacts:end -->"
          } > artifacts.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release view "$TAG" --json body --jq .body > body.md
            python3 - <<'PY'
          import pathlib, re

          body = pathlib.Path("body.md").read_text()
          block = pathlib.Path("artifacts.md").read_text().strip()
          pattern = re.compile(
              r"<!-- model-loader-artifacts:start -->.*?<!-- model-loader-artifacts:end -->",
              re.DOTALL,
          )
          if pattern.search(body):
              updated = pattern.sub(lambda _: block, body, count=1)
          elif body.strip():
              updated = body.rstrip() + "\n\n" + block + "\n"
          else:
              updated = block + "\n"
          pathlib.Path("updated_body.md").write_text(updated)
          PY
            gh release edit "$TAG" --notes-file updated_body.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --prerelease="$PRERELEASE" \
              --generate-notes --notes-file artifacts.md
          fi
