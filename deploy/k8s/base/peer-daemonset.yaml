apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model-loader-peer
spec:
  selector:
    matchLabels:
      app: model-loader
      role: peer
  template:
    metadata:
      labels:
        app: model-loader
        role: peer
    spec:
      containers:
        - name: model-loader
          image: ghcr.io/kindlingai/model-loader:latest
          args:
            - -mode=peer
            - -catalog=/etc/model-loader/catalog.yaml
            - -store=/var/lib/model-loader
            - -listen=:7762
            - -discovery=k8s
            - -k8s-service=model-loader-headless
            - -k8s-port=7762
          ports:
            - name: http
              containerPort: 7762
          readinessProbe:
            httpGet: { path: /status, port: http }
            initialDelaySeconds: 2
          resources:
            # A peer serving what it already has is meant to idle at close to
            # zero RAM; this is a ceiling against a runaway transfer, not a
            # realistic steady-state expectation.
            limits:
              memory: 256Mi
          volumeMounts:
            - name: catalog
              mountPath: /etc/model-loader
            - name: store
              mountPath: /var/lib/model-loader
      volumes:
        - name: catalog
          configMap:
            name: model-loader-catalog
        - name: store
          hostPath:
            path: /var/lib/model-loader
            type: DirectoryOrCreate
